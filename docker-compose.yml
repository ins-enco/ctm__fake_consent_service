version: '3.8'

services:
  # Broker Consent Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DATABASE_URL=${DATABASE_URL}
        - CTM_API_URL=${CTM_API_URL}
    container_name: pammboo2-consent-app
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CTM_API_URL=${CTM_API_URL}
      - NUXT_DB_PATCH_TOOL_HOST=${CTM_DB_HOST}
      - NUXT_DB_PATCH_TOOL_PORT=${CTM_DB_PORT:-3306}
      - NUXT_DB_PATCH_TOOL_DATABASE=${CTM_DB_NAME}
      - NUXT_DB_PATCH_TOOL_USER=${CTM_DB_USER}
      - NUXT_DB_PATCH_TOOL_PASSWORD=${CTM_DB_PASS}
      - NUXT_DB_PATCH_TOOL_KEY=${DB_PATCH_TOOL_KEY}
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - consent-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/hello').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MySQL Database
  database:
    image: mysql:8.0
    container_name: pammboo2-database
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-pammboo2}
      - MYSQL_USER=${MYSQL_USER:-pammboo_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-pammboo_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./prisma/migrations:/docker-entrypoint-initdb.d/migrations
    restart: unless-stopped
    profiles:
      - local-db
    networks:
      - consent-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prisma Studio (Optional - for database management)
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile.prisma-studio
    container_name: pammboo2-prisma-studio
    ports:
      - "${PRISMA_STUDIO_PORT:-5555}:5555"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - database
    profiles:
      - dev
    networks:
      - consent-network

networks:
  consent-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
