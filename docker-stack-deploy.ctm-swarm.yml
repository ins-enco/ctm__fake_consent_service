# Docker Swarm stack for the CTM preprod swarm (c27/c29/c30 managers, c30v2 worker),
# deployed manually via Portainer (Stacks -> Repository -> this file).
#
# Separate from docker-stack-deploy.yml on purpose: that file is consumed as-is by
# .github/workflows/deploy-prod.yml for the existing "S6" target (public domain via
# Traefik) — do not merge the two, editing it would change that pipeline's behavior.
#
# This stack is pinned to c30v2 (the only node labeled env=dev) and published with
# mode: host rather than the default ingress routing mesh, so the port only opens on
# c30v2 — which has no public IP of its own (only 10.28.30.102, NATed behind c30) —
# instead of on every swarm node, several of which do have public IPs.
services:
  app:
    image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.env == dev
    ports:
      - target: 3000
        published: ${APP_PORT:-3000}
        protocol: tcp
        mode: host
    environment:
      - NODE_ENV=production
      - APPNAME=${APPNAME:-CTM Fake Consent Service}
      - BASE_URL=${BASE_URL}
      - CTM_API_URL=${CTM_API_URL:-}
      - CTM_DB_HOST=${CTM_DB_HOST}
      - CTM_DB_PORT=${CTM_DB_PORT}
      - CTM_DB_NAME=${CTM_DB_NAME}
      - CTM_DB_USER=${CTM_DB_USER}
      - CTM_DB_PASS=${CTM_DB_PASS}
      - DB_PATCH_TOOL_KEY=${DB_PATCH_TOOL_KEY}
      - CONSENT_AUTOPATCH_ON_LOGIN=${CONSENT_AUTOPATCH_ON_LOGIN:-false}
      - CONSENT_RETURN_URL=${CONSENT_RETURN_URL:-}
